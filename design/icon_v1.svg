<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <!-- 圆点激活渐变 -->
    <linearGradient id="dotActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0ff"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底座 -->
  <rect x="32" y="32" width="960" height="960" rx="210" ry="210" fill="url(#bgGrad)"/>

  <!-- 4个控制点（2x2网格）代表"快捷操作面板" -->
  <!-- 左上：激活态 -->
  <circle cx="290" cy="290" r="110" fill="url(#dotActive)" opacity="1"/>
  <!-- 右上：半激活 -->
  <circle cx="734" cy="290" r="110" fill="#ffffff" opacity="0.6"/>
  <!-- 左下：待机 -->
  <circle cx="290" cy="734" r="110" fill="#ffffff" opacity="0.35"/>
  <!-- 右下：待机 -->
  <circle cx="734" cy="734" r="110" fill="#ffffff" opacity="0.2"/>

  <!-- 左上角的"闪电"图标（代表"快速/快捷"） -->
  <path d="M 270 240 L 300 240 L 285 290 L 320 290 L 275 350 L 290 300 Z"
        fill="#667eea" opacity="0.0"/>

  <!-- 左上角圆点的微光 -->
  <circle cx="290" cy="290" r="80" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.15"/>
</svg>
